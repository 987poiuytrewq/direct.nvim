name: Feature request
description: Suggest a change to direct.nvim
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a new capability or improvement. For a bug, use the bug report form instead.

        Do not include personal, private, or security-sensitive information. If you found a vulnerability involving data loss or an unintended command, follow the private reporting instructions in `SECURITY.md`.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case and what is difficult or missing today.
      placeholder: "When I ..., I need ..., because ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or capability you have in mind. It's okay if you are unsure about the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: What workarounds or alternatives have you considered? Include any other relevant context, without sharing sensitive data.
    validations:
      required: false
